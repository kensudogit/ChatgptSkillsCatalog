name: Deploy ECS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "samples/**"
      - ".gitignore"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO || 'skills-catalog-backend' }}
  ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO || 'skills-catalog-frontend' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'skills-catalog' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'skills-catalog' }}
  FRONTEND_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL || 'https://api.skills.example.com/api/v1' }}

jobs:
  deploy:
    name: Build, push, and deploy
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_ECS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          ACCOUNT_ID="${REGISTRY%%.*}"
          TAG="${GITHUB_SHA:0:12}"
          {
            echo "account_id=${ACCOUNT_ID}"
            echo "image_tag=${TAG}"
            echo "backend_image=${REGISTRY}/${{ env.ECR_BACKEND_REPO }}:${TAG}"
            echo "frontend_image=${REGISTRY}/${{ env.ECR_FRONTEND_REPO }}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=gha,scope=backend-deploy
          cache-to: type=gha,mode=max,scope=backend-deploy

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.FRONTEND_API_BASE_URL }}
          cache-from: type=gha,scope=frontend-deploy
          cache-to: type=gha,mode=max,scope=frontend-deploy

      - name: Prepare task definition
        id: prepare-task
        run: |
          ACCOUNT_ID="${{ steps.meta.outputs.account_id }}"
          sed "s/ACCOUNT_ID/${ACCOUNT_ID}/g" \
            infrastructure/ecs/task-definition.json \
            > /tmp/task-definition.json
          echo "task_definition=/tmp/task-definition.json" >> "$GITHUB_OUTPUT"

      - name: Render Amazon ECS task definition (backend)
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.prepare-task.outputs.task_definition }}
          container-name: backend
          image: ${{ steps.meta.outputs.backend_image }}

      - name: Render Amazon ECS task definition (frontend)
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: frontend
          image: ${{ steps.meta.outputs.frontend_image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
